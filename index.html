<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Diamond Chase 3D</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;color:white;font-size:19px;font-weight:900;text-shadow:0 2px 5px #000;z-index:3}
.menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;z-index:10}
.card{width:min(430px,90vw);padding:28px;border-radius:22px;background:#102238;color:white;text-align:center}
.card h1{font-size:35px;margin:0 0 8px}.card p{opacity:.85}
button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:14px;font-size:18px;font-weight:900}
#start{background:white;color:#102238}
.joy{position:fixed;left:24px;bottom:25px;width:140px;height:140px;border:3px solid #ffffff66;border-radius:50%;background:#ffffff14;z-index:5}
.stick{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:#ffffff55;border:2px solid #fff9}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:white;font-size:34px;font-weight:900;text-shadow:0 3px 8px #000;z-index:8;pointer-events:none}
</style>
</head>
<body>
<div id="menu" class="menu">
  <div class="card">
    <h1>💎 Diamond Chase 3D</h1>
    <p>收集寶石並追上電腦！先得到 5 分獲勝 🏆</p>
    <button id="start">🤖 開始遊戲</button>
    <p style="font-size:13px">左下搖桿移動；碰到 💎 就得 1 分。</p>
  </div>
</div>
<div class="hud"><div>YOU <span id="score">0</span> : <span id="botScore">0</span> BOT</div><div>💎 先到 5 分</div></div>
<div id="msg"></div>
<div class="joy" id="joy"><div class="stick" id="stick"></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
let scene,camera,renderer,player,bot,gem,score=0,botScore=0,started=false;
let joyX=0,joyY=0,keys={};

function makeChar(color){
  const g=new THREE.Group();
  const body=new THREE.Mesh(
    new THREE.CapsuleGeometry(.55,1.2,4,8),
    new THREE.MeshStandardMaterial({color})
  );
  body.position.y=1; g.add(body);
  scene.add(g); return g;
}
function placeGem(){
  gem.position.set((Math.random()-.5)*40,1,(Math.random()-.5)*40);
}
function resetRound(){
  player.position.set(0,0,8);
  bot.position.set((Math.random()-.5)*12,0,-8);
  placeGem();
}
function startGame(){
  score=botScore=0;
  document.getElementById("score").textContent=0;
  document.getElementById("botScore").textContent=0;
  document.getElementById("msg").textContent="";
  document.getElementById("menu").style.display="none";
  started=true; resetRound();
}
function end(win){
  started=false;
  document.getElementById("msg").textContent=win?"🏆 YOU WIN!":"🤖 BOT WINS!";
  setTimeout(()=>document.getElementById("menu").style.display="flex",1200);
}
function point(who){
  if(who==="you"){
    score++; document.getElementById("score").textContent=score;
    if(score>=5){end(true);return}
  }else{
    botScore++; document.getElementById("botScore").textContent=botScore;
    if(botScore>=5){end(false);return}
  }
  resetRound();
}
function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x07111f);
  scene.fog=new THREE.Fog(0x07111f,18,65);
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xcfe8ff,0x203040,2));
  const floor=new THREE.Mesh(
    new THREE.PlaneGeometry(70,70),
    new THREE.MeshStandardMaterial({color:0x162a3d,roughness:1})
  );
  floor.rotation.x=-Math.PI/2; scene.add(floor);

  for(let i=0;i<28;i++){
    const h=1+Math.random()*5;
    const m=new THREE.Mesh(
      new THREE.BoxGeometry(1.5,h,1.5),
      new THREE.MeshStandardMaterial({color:0x29445e})
    );
    m.position.set((Math.random()-.5)*52,h/2,(Math.random()-.5)*52);
    scene.add(m);
  }

  player=makeChar(0x38bdf8);
  bot=makeChar(0xff5577);

  gem=new THREE.Mesh(
    new THREE.OctahedronGeometry(.7),
    new THREE.MeshStandardMaterial({color:0x55eaff,emissive:0x113344,metalness:.3,roughness:.2})
  );
  scene.add(gem);

  document.getElementById("start").onclick=startGame;
  addEvents(); resetRound(); animate();
}
function update(dt){
  if(!started)return;
  let f=-joyY,r=joyX;
  if(keys.w)f+=1;if(keys.s)f-=1;if(keys.d)r+=1;if(keys.a)r-=1;
  const len=Math.hypot(f,r)||1;
  const speed=dt*6;
  player.position.x+=r/len*speed;
  player.position.z+=f/len*speed;
  player.position.x=Math.max(-25,Math.min(25,player.position.x));
  player.position.z=Math.max(-25,Math.min(25,player.position.z));

  let dx=gem.position.x-bot.position.x,dz=gem.position.z-bot.position.z;
  let d=Math.hypot(dx,dz)||1;
  bot.position.x+=dx/d*dt*3.0;
  bot.position.z+=dz/d*dt*3.0;

  if(player.position.distanceTo(gem.position)<1.6) point("you");
  else if(bot.position.distanceTo(gem.position)<1.6) point("bot");

  gem.rotation.y+=dt*2.5; gem.rotation.x+=dt*1.5;
  camera.position.set(player.position.x,3.0,player.position.z+5.5);
  camera.lookAt(player.position.x,1,player.position.z-2);
}
let prev=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(),dt=Math.min(.05,(now-prev)/1000);prev=now;
  update(dt); renderer.render(scene,camera);
}
function addEvents(){
  addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
  addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
  addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

  const joy=document.getElementById("joy"),stick=document.getElementById("stick");
  function setJoy(e){
    const q=joy.getBoundingClientRect(),cx=q.left+q.width/2,cy=q.top+q.height/2;
    let x=e.clientX-cx,y=e.clientY-cy,m=55,l=Math.hypot(x,y)||1;
    if(l>m){x=x/l*m;y=y/l*m}
    joyX=x/m;joyY=y/m;
    stick.style.transform=`translate(${x}px,${y}px)`;
  }
  function endJoy(){joyX=joyY=0;stick.style.transform=""}
  joy.addEventListener("pointerdown",e=>{joy.setPointerCapture(e.pointerId);setJoy(e)});
  joy.addEventListener("pointermove",e=>{if(e.buttons)setJoy(e)});
  joy.addEventListener("pointerup",endJoy);
  joy.addEventListener("pointercancel",endJoy);
}
init();
</script>
</body>
</html>
